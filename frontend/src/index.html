<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowDL — yt-dlp Desktop</title>
  <link rel="stylesheet" href="./main.css" />
</head>
<body>
  <div class="deck">
    <!-- Top Utility Bar -->
    <header class="deck-topbar">
      <div class="topbar-left">
        <div class="deck-logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" />
          </svg>
        </div>
        <div class="deck-title-group">
          <span class="deck-title">FlowDL</span>
          <span class="deck-ver">v2.0</span>
        </div>
        <div class="sys-telemetry" id="depBadge" title="yt-dlp and ffmpeg runtime status">
          <span class="telemetry-dot" id="depDot"></span>
          <span class="telemetry-text" id="depText">Checking system engine...</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="dest-selector" title="Destination folder for downloads">
          <span class="dest-label">Save to</span>
          <button class="dest-path-btn" id="btnChangeDir" title="Click to change folder">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" />
            </svg>
            <span class="dest-path-text" id="currentSavePath">~/Downloads</span>
          </button>
          <button class="icon-tool-btn" id="btnOpenFolder" title="Open destination folder in File Manager">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="deck-workspace">
      <!-- Ingestion & Configuration Console -->
      <section class="ingest-deck">
        <div class="omni-bar">
          <div class="omni-input-wrap" id="singleWrap">
            <svg class="omni-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
            </svg>
            <input 
              type="text" 
              id="urlInput" 
              class="omni-field" 
              placeholder="Paste video or audio stream URL..." 
              autocomplete="off" 
              spellcheck="false" 
            />
            <button class="clear-field-btn" id="btnClearUrl" title="Clear input" style="display:none;">✕</button>
          </div>

          <!-- Batch text area (toggled via button) -->
          <div class="batch-field-wrap" id="batchWrap" style="display:none;">
            <textarea 
              id="batchUrlsInput" 
              class="batch-field" 
              placeholder="Paste multiple URLs (one per line)..." 
              rows="3" 
              spellcheck="false"
            ></textarea>
          </div>

          <div class="omni-actions">
            <button class="deck-btn deck-btn-ghost" id="tabModeToggle" title="Toggle single / batch mode">
              <span id="tabModeLabel">Batch</span>
            </button>
            <button class="deck-btn deck-btn-ghost" id="btnPasteClip" title="Paste link from clipboard">
              Paste
            </button>
            <button class="deck-btn deck-btn-secondary" id="btnInspect" title="Fetch video metadata and stream specs">
              <span class="btn-spinner" id="inspectSpinner" style="display:none;"></span>
              <span id="inspectBtnText">Inspect</span>
            </button>
            <button class="deck-btn deck-btn-primary" id="btnDownload">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
              </svg>
              <span id="btnDownloadText">Download</span>
            </button>
          </div>
        </div>

        <!-- Metadata Inspection Strip (revealed after Inspect) -->
        <div class="inspect-strip" id="mediaPreview" style="display:none;">
          <div class="inspect-thumb">
            <img id="previewThumb" src="" alt="Thumbnail" />
            <span class="inspect-duration" id="previewDuration">00:00</span>
          </div>
          <div class="inspect-info">
            <div class="inspect-title" id="previewTitle">Video Title</div>
            <div class="inspect-sub">
              <span id="previewUploader">Channel</span>
              <span class="inspect-dot">•</span>
              <span id="previewMetaTags">Detected formats</span>
            </div>
          </div>
        </div>

        <!-- Format & Encoding Options Strip -->
        <div class="options-deck">
          <div class="options-group">
            <span class="group-label">Output</span>
            <div class="seg-track" id="formatTypeControl">
              <button class="seg-item active" data-type="video">Video (MP4)</button>
              <button class="seg-item" data-type="audio">Audio Only</button>
            </div>
          </div>

          <!-- Video Resolutions -->
          <div class="options-group" id="videoQualityRow">
            <span class="group-label">Quality</span>
            <div class="pill-group" id="videoQualityChips">
              <button class="pill active" data-quality="best">Maximum</button>
              <button class="pill" data-quality="2160p">4K (2160p)</button>
              <button class="pill" data-quality="1440p">1440p</button>
              <button class="pill" data-quality="1080p">1080p</button>
              <button class="pill" data-quality="720p">720p</button>
              <button class="pill" data-quality="480p">480p</button>
            </div>
          </div>

          <!-- Audio Codecs -->
          <div class="options-group" id="audioFormatRow" style="display:none;">
            <span class="group-label">Codec</span>
            <div class="pill-group" id="audioFormatChips">
              <button class="pill active" data-audio="mp3">MP3 320k</button>
              <button class="pill" data-audio="m4a">M4A AAC</button>
              <button class="pill" data-audio="flac">FLAC Lossless</button>
              <button class="pill" data-audio="opus">OPUS</button>
              <button class="pill" data-audio="wav">WAV</button>
            </div>
          </div>

          <!-- Feature Flags -->
          <div class="options-group options-flags">
            <label class="flag-check" title="Embed subtitles into file">
              <input type="checkbox" id="chkEmbedSubs" />
              <span class="flag-box"></span>
              <span class="flag-text">Subtitles</span>
            </label>
            <label class="flag-check" title="Embed video thumbnail as cover art">
              <input type="checkbox" id="chkEmbedThumb" checked />
              <span class="flag-box"></span>
              <span class="flag-text">Thumbnail</span>
            </label>
            <label class="flag-check" title="Embed chapter marks and media tags">
              <input type="checkbox" id="chkEmbedMeta" checked />
              <span class="flag-box"></span>
              <span class="flag-text">Metadata</span>
            </label>
            <label class="flag-check" title="Download all items if URL is a playlist">
              <input type="checkbox" id="chkPlaylist" />
              <span class="flag-box"></span>
              <span class="flag-text">Playlist</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Transfer Ledger (The Workhorse) -->
      <section class="ledger-deck">
        <div class="ledger-header">
          <div class="ledger-filter-group">
            <button class="ledger-tab active" data-filter="all">
              All <span class="tab-badge" id="countAll">0</span>
            </button>
            <button class="ledger-tab" data-filter="active">
              Active <span class="tab-badge" id="countActive">0</span>
            </button>
            <button class="ledger-tab" data-filter="completed">
              Completed <span class="tab-badge" id="countCompleted">0</span>
            </button>
          </div>

          <div class="ledger-actions">
            <button class="deck-btn deck-btn-ghost btn-sm" id="btnClearFinished" title="Clear completed and failed items">
              Clear Finished
            </button>
          </div>
        </div>

        <!-- Transfer Rows Container -->
        <div class="ledger-body" id="queueList">
          <!-- Empty State -->
          <div class="ledger-empty" id="emptyState">
            <div class="empty-mark">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 00-2.25 2.25v9a2.25 2.25 0 002.25 2.25h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25H15M9 12l3 3m0 0l3-3m-3 3V2.25" />
              </svg>
            </div>
            <div class="empty-title">Queue is idle</div>
            <div class="empty-sub">Enter a media URL above to begin downloading</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Status Strip -->
    <footer class="deck-footer">
      <div class="footer-left">
        <span class="footer-metric" id="footerActiveCount">0 active transfers</span>
        <span class="footer-divider">|</span>
        <span class="footer-metric" id="footerSpeed">0.0 KiB/s</span>
      </div>
      <div class="footer-right">
        <span class="footer-engine">Backend: yt-dlp native process • ffmpeg remux pipeline</span>
      </div>
    </footer>

    <!-- Toast Notice Container -->
    <div class="toast-deck" id="toastContainer"></div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
