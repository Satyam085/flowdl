<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2331"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.04)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.25)"/>
    </linearGradient>

    <!-- Accent Flow Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(6, 182, 212, 0.4)"/>
    </filter>
  </defs>

  <!-- Ambient Shadow & Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#subtleShadow)"/>
  
  <!-- Metallic Chamfered Rim -->
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

  <!-- Media Stream Concentric Track Arcs -->
  <g fill="none" stroke="currentColor" opacity="0.12" stroke-linecap="round">
    <circle cx="256" cy="256" r="140" stroke="#f0f6fc" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="256" cy="256" r="110" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="6 8"/>
  </g>

  <!-- Central Download Arrow Emblem -->
  <g filter="url(#arrowShadow)">
    <!-- Stream Vector Spine -->
    <path d="M256 128 V310" stroke="url(#streamGrad)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Chevron Head -->
    <path d="M172 248 L256 332 L340 248" fill="none" stroke="url(#streamGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base Tray Arc -->
    <path d="M152 356 C180 380, 332 380, 360 356" fill="none" stroke="url(#streamGrad)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
